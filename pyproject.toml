[project]
name = "atelier"
version = "0.1.0"
description = "Asset Kitchen — atelier personnel de production d'assets 2D pour jeu"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pillow>=11.0",
    "numpy>=2.0",
    # Le serveur MCP de T7. **Dépendance dure, pas optionnelle** : il tourne dans
    # le même processus que l'API et se monte sur la même application — c'est ce
    # qui fait que ce que l'agent produit paraît en direct dans la grille, sans
    # second écrivain sur le disque ni seconde diffusion. Un montage conditionnel
    # offrirait un atelier à moitié installé, sans rien en dire.
    "mcp>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
# Le second moteur de détourage. Optionnel **exprès** : il télécharge au premier
# usage le modèle ONNX `u2net` (176 Mo), et le produit doit continuer de détourer
# hors ligne sans lui. Absent, il est grisé avec sa raison.
#
# Le modèle est **nommé** dans `atelier/image/traitement.py`, jamais laissé au
# défaut de la bibliothèque : celui de `rembg` 2.0.81 est `bria-rmbg`, un
# gigaoctet qui met 15,8 s par image de 1024 px sur processeur, là où `u2net`
# met 0,47 s pour une silhouette équivalente à deux points près.
detourage = ["rembg>=2.0", "onnxruntime>=1.20"]

[project.scripts]
atelier = "atelier.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atelier"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
