[project]
name = "atelier"
version = "0.1.0"
description = "Asset Kitchen — atelier personnel de production d'assets 2D pour jeu"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pillow>=11.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
# Le second moteur de détourage. Optionnel **exprès** : il embarque un modèle
# ONNX de ~180 Mo téléchargé au premier usage, et le produit doit continuer de
# détourer hors ligne sans lui. Absent, il est grisé avec sa raison.
detourage = ["rembg>=2.0", "onnxruntime>=1.20"]

[project.scripts]
atelier = "atelier.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atelier"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
